# CI from murphy360/standards (templates/ci.yml). Every job calls a shared workflow at the pinned tag @v1.
# Keep the jobs that apply to the project. Any other action you add must be pinned to a full commit SHA,
# with the version in a comment (the `standards` job fails otherwise).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standards:
    uses: murphy360/standards/.github/workflows/standards-check.yml@v1
  lint:
    uses: murphy360/standards/.github/workflows/python-lint.yml@v1
    with:
      format-check: true
  shell:
    uses: murphy360/standards/.github/workflows/shell-lint.yml@v1
  workflows:
    uses: murphy360/standards/.github/workflows/actionlint.yml@v1
  test:
    uses: murphy360/standards/.github/workflows/test-docker.yml@v1
    with:
      command: "pytest -q"
  image:
    needs: [lint, test]
    uses: murphy360/standards/.github/workflows/image.yml@v1
    with:
      # NEW PROJECT: rename the image (it is published as ghcr.io/<owner>/<image>) and change `push` to
      #   push: ${{ github.event_name != 'pull_request' }}
      # so that a push to main publishes it. The template itself only builds, so that it never publishes
      # an image named after the placeholder.
      image: my-service
      push: false
    permissions:
      contents: read
      packages: write
